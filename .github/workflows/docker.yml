name: Build and Push AutoSub Multi-Tier Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. Build Dynamic Audio Worker (Steps 0-5)
  # ========================================================
  build-worker:
    name: Build & Push Audio Worker (Steps 0-5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space for Pre-baked Audio Models
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Dynamic Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/autosub-worker:latest
            ghcr.io/${{ env.OWNER_LC }}/autosub-worker:baked
            ghcr.io/${{ env.OWNER_LC }}/autosub-worker:${{ github.sha }}

  # ========================================================
  # 2. Build Tier 2 Typhoon 2.1 Gemma3 12B (Step 6)
  # ========================================================
  build-typhoon:
    name: Build & Push Typhoon Node (Step 6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Typhoon Node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.typhoon
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/autosub-typhoon:latest
            ghcr.io/${{ env.OWNER_LC }}/autosub-typhoon:${{ github.sha }}

  # ========================================================
  # 3. Build Tier 3 Qwen 2.5 14B Q5_K_M (Step 7)
  # ========================================================
  build-qwen:
    name: Build & Push Qwen Node (Step 7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Qwen Node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.qwen
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/autosub-qwen:latest
            ghcr.io/${{ env.OWNER_LC }}/autosub-qwen:${{ github.sha }}

  # ========================================================
  # 4. Build Unified Master LLM (Pre-baked Typhoon 2.5 30B MoE)
  # ========================================================
  build-master:
    name: Build & Push Master LLM (Pre-baked Typhoon 30B)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space for 18.5GB LLM Layer
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Master LLM
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.master
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/autosub-master:latest
            ghcr.io/${{ env.OWNER_LC }}/autosub-master:baked
            ghcr.io/${{ env.OWNER_LC }}/autosub-master:${{ github.sha }}
